<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺运营台 · Copilot Console</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel2: #1a2030; --panel3: #202839;
    --line: #262e40; --line2: #303a52;
    --text: #e8ecf4; --muted: #8b94a8; --faint: #5c657a;
    --accent: #5b8cff; --accent2: #7aa5ff;
    --green: #3ddc97; --red: #ff6b6b; --amber: #ffc247; --cyan: #4dd0e1;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: var(--line2) var(--bg); }
  body {
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(91,140,255,.07), transparent 60%),
      radial-gradient(900px 400px at 10% 110%, rgba(61,220,151,.05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 20px 24px 40px;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; }

  /* ---------- header ---------- */
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .logo { font-size: 19px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 9px; }
  .logo .store { background: linear-gradient(135deg, var(--accent), #9f6bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ver { font-size: 11px; color: var(--accent2); background: rgba(91,140,255,.12); border: 1px solid rgba(91,140,255,.3); padding: 2px 9px; border-radius: 20px; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  .live.down .dot { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(61,220,151,.5);} 50% { box-shadow: 0 0 0 6px rgba(61,220,151,0);} }
  .btn-ghost {
    background: transparent; border: 1px solid var(--line2); color: var(--muted);
    padding: 6px 13px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
    transition: all .18s ease;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); background: rgba(91,140,255,.08); }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px 17px; position: relative; overflow: hidden;
    transition: transform .18s ease, border-color .18s ease;
  }
  .kpi:hover { transform: translateY(-2px); border-color: var(--line2); }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 7px; display:flex; align-items:center; gap:6px; }
  .kpi .value { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
  .kpi .delta { position: absolute; top: 15px; right: 15px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .delta.up { color: var(--green); background: rgba(61,220,151,.1); }
  .delta.down { color: var(--red); background: rgba(255,107,107,.1); }
  .delta.flat { color: var(--muted); background: var(--panel3); }
  .kpi .sub { color: var(--faint); font-size: 11px; margin-top: 5px; }

  /* ---------- main grid ---------- */
  .cols { display: grid; grid-template-columns: 5fr 2fr; gap: 14px; margin-bottom: 14px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px;
  }
  .panel h2 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .6px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .right { margin-left: auto; display: flex; gap: 6px; }
  .seg { display: flex; background: var(--panel3); border-radius: 8px; padding: 2px; }
  .seg button {
    border: none; background: transparent; color: var(--muted); font-size: 11.5px;
    padding: 4px 11px; border-radius: 6px; cursor: pointer; transition: all .15s ease;
  }
  .seg button.on { background: var(--accent); color: #fff; }

  /* chart */
  #chart-wrap { position: relative; }
  #chart { width: 100%; height: 210px; display: block; cursor: crosshair; }
  #chart-tip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(13,17,27,.95); border: 1px solid var(--line2); border-radius: 8px;
    padding: 8px 11px; font-size: 12px; white-space: nowrap; z-index: 5;
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  #chart-tip b { font-size: 14px; font-variant-numeric: tabular-nums; }

  /* data quality */
  .dq-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 12.8px; animation: fadeIn .3s ease; }
  .dq-item:last-child { border-bottom: none; }
  .dq-item .muted { color: var(--faint); font-family: Consolas, monospace; font-size: 11.5px; }
  .tag { display: inline-block; font-size: 10.5px; padding: 1.5px 8px; border-radius: 5px; margin-right: 7px; font-weight: 600; }
  .tag.low { background: rgba(255,194,71,.12); color: var(--amber); }
  .tag.zero { background: rgba(255,107,107,.12); color: var(--red); }
  .tag.desc { background: rgba(77,208,225,.12); color: var(--cyan); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 0; position: relative; }
  .tab {
    border: none; background: transparent; color: var(--muted); font-size: 13.5px; cursor: pointer;
    padding: 10px 16px 12px; position: relative; transition: color .18s ease; font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent2); }
  .tab .badge-n {
    display: inline-block; min-width: 18px; text-align: center; font-size: 10.5px; font-weight: 700;
    background: var(--amber); color: #3a2a00; border-radius: 20px; padding: 1px 6px; margin-left: 5px;
    transition: transform .2s ease;
  }
  .tab .badge-n.zero { background: var(--panel3); color: var(--faint); }
  .tab::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px;
    background: var(--accent); border-radius: 2px; transform: scaleX(0); transition: transform .22s cubic-bezier(.4,0,.2,1);
  }
  .tab.on::after { transform: scaleX(1); }

  .tabpanels { border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius) var(--radius); background: var(--panel); padding: 18px; }
  .tabpanel { display: none; }
  .tabpanel.on { display: block; animation: fadeInUp .28s ease; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  @keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }

  /* ---------- staged changes ---------- */
  .filters { display: flex; gap: 8px; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line2); background: transparent; color: var(--muted);
    font-size: 12px; padding: 4px 13px; border-radius: 20px; cursor: pointer; transition: all .16s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: rgba(91,140,255,.14); border-color: var(--accent); color: var(--accent2); }
  .chg {
    background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 10px; padding: 13px 15px; margin-bottom: 10px;
    animation: fadeInUp .3s ease; transition: border-color .18s ease, transform .18s ease;
  }
  .chg:hover { border-color: var(--line2); transform: translateX(2px); }
  .chg.applied { border-left-color: var(--green); }
  .chg.rejected { border-left-color: var(--red); opacity: .65; }
  .chg .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .chg .action { font-weight: 600; font-size: 13.5px; }
  .chg .id { color: var(--faint); font-size: 11.5px; font-family: Consolas, monospace; }
  .badge { font-size: 11px; padding: 2.5px 10px; border-radius: 20px; background: rgba(255,194,71,.12); color: var(--amber); font-weight: 600; }
  .badge.applied { background: rgba(61,220,151,.12); color: var(--green); }
  .badge.rejected { background: rgba(255,107,107,.12); color: var(--red); }
  .chg .params {
    font-family: Consolas, monospace; font-size: 12px; color: #b9c2d4;
    background: #0e1219; border-radius: 7px; padding: 8px 11px; margin: 8px 0;
    white-space: pre-wrap; word-break: break-all; border: 1px solid var(--line);
  }
  .chg .reason { color: var(--muted); font-size: 12.3px; margin-bottom: 10px; }
  .chg .reason::before { content: '💬 '; opacity: .7; }
  .btn {
    border: none; border-radius: 8px; padding: 7px 16px; font-size: 12.8px; cursor: pointer;
    margin-right: 8px; font-weight: 600; transition: all .16s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn-approve { background: var(--green); color: #06240f; box-shadow: 0 2px 10px rgba(61,220,151,.25); }
  .btn-approve:hover { box-shadow: 0 4px 16px rgba(61,220,151,.4); }
  .btn-reject { background: transparent; color: var(--red); border: 1px solid rgba(255,107,107,.5); }
  .btn-reject:hover { background: rgba(255,107,107,.1); }
  .btn:disabled { opacity: .4; cursor: wait; }
  .empty { color: var(--faint); font-size: 13px; padding: 26px; text-align: center; }
  .empty code { background: var(--panel3); padding: 1px 7px; border-radius: 5px; color: var(--accent2); }

  /* ---------- products ---------- */
  .prod-controls { display: flex; gap: 9px; margin-bottom: 13px; flex-wrap: wrap; }
  .input, select.input {
    background: var(--panel2); border: 1px solid var(--line2); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 12.8px; outline: none; transition: border-color .16s ease;
  }
  .input:focus { border-color: var(--accent); }
  table.prod { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  table.prod th { text-align: left; color: var(--faint); font-weight: 500; font-size: 11.5px; padding: 7px 9px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  table.prod td { padding: 8px 9px; border-bottom: 1px dashed var(--line); }
  table.prod tr { transition: background .14s ease; }
  table.prod tr:hover td { background: rgba(91,140,255,.045); }
  .inv-bar { width: 74px; height: 5px; background: var(--panel3); border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 7px; overflow: hidden; }
  .inv-bar i { display: block; height: 100%; border-radius: 4px; background: var(--green); transition: width .5s cubic-bezier(.4,0,.2,1); }
  .inv-bar.warn i { background: var(--amber); }
  .inv-bar.bad i { background: var(--red); }
  .vchip {
    display: inline-block; font-family: Consolas, monospace; font-size: 11px; color: var(--muted);
    background: var(--panel3); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0;
  }
  .vchip b { color: var(--text); font-weight: 600; }
  .vchip.danger { border-color: rgba(255,107,107,.5); color: var(--red); }

  /* ---------- copilot ---------- */
  .cop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .preset-group { margin-bottom: 12px; }
  .preset-group .g-title { font-size: 11.5px; color: var(--faint); margin-bottom: 7px; letter-spacing: .4px; }
  .presets { display: flex; flex-wrap: wrap; gap: 7px; }
  .preset {
    border: 1px solid var(--line2); background: var(--panel2); color: var(--text);
    font-size: 12.3px; padding: 6px 12px; border-radius: 9px; cursor: pointer; transition: all .16s ease;
    animation: fadeIn .35s ease;
  }
  .preset:hover { border-color: var(--accent); background: rgba(91,140,255,.1); transform: translateY(-1px); }
  .preset:disabled { opacity: .45; cursor: wait; transform: none; }
  .preset .t { font-size: 10px; margin-right: 6px; }
  .run-box { display: flex; gap: 8px; margin-top: 4px; }
  .run-box .input { flex: 1; }
  .btn-run {
    background: linear-gradient(135deg, var(--accent), #7b5bff); color: #fff; border: none;
    border-radius: 8px; padding: 7px 18px; font-size: 12.8px; font-weight: 600; cursor: pointer; transition: all .18s ease;
    box-shadow: 0 2px 12px rgba(91,140,255,.3);
  }
  .btn-run:hover { box-shadow: 0 4px 20px rgba(91,140,255,.45); }
  .btn-run:disabled { opacity: .5; cursor: wait; }
  .trace { margin-top: 13px; }
  .step {
    display: flex; gap: 9px; align-items: baseline; font-size: 12.6px; padding: 6px 0 6px 4px;
    border-left: 2px solid var(--line2); margin-left: 6px; padding-left: 13px;
    animation: fadeInUp .3s ease; color: var(--muted);
  }
  .step .t-icon { font-size: 13px; }
  .step code { font-family: Consolas, monospace; color: var(--accent2); font-size: 11.8px; word-break: break-all; }
  .step.err code { color: var(--red); }
  .answer {
    margin-top: 12px; background: linear-gradient(180deg, rgba(91,140,255,.08), rgba(91,140,255,.03));
    border: 1px solid rgba(91,140,255,.25); border-radius: 10px; padding: 13px 15px;
    font-size: 13.2px; line-height: 1.65; animation: fadeInUp .35s ease; white-space: pre-wrap;
  }
  .answer .who { color: var(--accent2); font-weight: 700; font-size: 12px; display: block; margin-bottom: 6px; }
  .job-meta { margin-top: 10px; color: var(--faint); font-size: 11.5px; font-family: Consolas, monospace; }
  .goto-queue { margin-left: 10px; color: var(--amber); cursor: pointer; font-size: 12.3px; text-decoration: underline; text-underline-offset: 3px; }
  .hint { color: var(--faint); font-size: 12px; margin-top: 10px; line-height: 1.7; }

  /* ---------- audit ---------- */
  .audit { font-size: 12px; color: var(--muted); font-family: Consolas, monospace; max-height: 420px; overflow-y: auto; }
  .audit div { padding: 5px 2px; border-bottom: 1px dashed var(--line); animation: fadeIn .3s ease; }
  .audit .ev { color: var(--accent2); }
  .audit .who { color: var(--cyan); }

  /* ---------- insights ---------- */
  .insights-wrap { margin-bottom: 14px; }
  .insights-head { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .5px; margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
  .ins-sub { font-weight: 400; font-size: 11.5px; color: var(--faint); }
  .insights { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(295px, 1fr); gap: 11px; overflow-x: auto; padding-bottom: 5px; }
  .ins-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px; border-left-width: 3px;
    animation: fadeInUp .35s ease; transition: transform .18s ease, border-color .18s ease;
    display: flex; flex-direction: column; gap: 7px;
  }
  .ins-card:hover { transform: translateY(-2px); border-color: var(--line2); }
  .ins-card.danger { border-left-color: var(--red); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--panel)); }
  .ins-card.warn { border-left-color: var(--amber); background: linear-gradient(180deg, rgba(255,194,71,.05), var(--panel)); }
  .ins-card.info { border-left-color: var(--cyan); }
  .ins-title { font-size: 13px; font-weight: 600; line-height: 1.45; }
  .ins-detail { font-size: 12px; color: var(--muted); line-height: 1.6; flex: 1; }
  .ins-actions { display: flex; gap: 7px; }
  .btn-mini {
    border: 1px solid var(--line2); background: var(--panel2); color: var(--text);
    font-size: 11.8px; padding: 5px 11px; border-radius: 7px; cursor: pointer; transition: all .16s ease; font-weight: 500;
  }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent2); }
  .btn-mini:disabled { opacity: .45; cursor: wait; }
  .btn-mini.primary { background: rgba(91,140,255,.14); border-color: rgba(91,140,255,.45); color: var(--accent2); }
  .btn-mini.primary:hover { background: rgba(91,140,255,.24); }
  .sim-on { color: var(--green) !important; border-color: rgba(61,220,151,.4) !important; }

  /* ---------- toasts ---------- */
  .toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 9px; z-index: 99; }
  .toast {
    background: var(--panel3); border: 1px solid var(--line2); border-radius: 10px;
    padding: 11px 16px; font-size: 13px; min-width: 240px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2); display: flex; gap: 9px; align-items: center;
  }
  .toast.ok { border-color: rgba(61,220,151,.5); }
  .toast.bad { border-color: rgba(255,107,107,.5); }
  .toast.leaving { transition: all .3s ease; opacity: 0; transform: translateX(30px); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px);} to { opacity: 1; transform: none;} }

  @media (max-width: 1000px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .cop-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🏪 <span class="store">店铺运营台</span></div>
  <span class="ver">Copilot Console v0.3</span>
  <div class="live" id="live"><div class="dot"></div><span id="live-text">已连接</span></div>
  <button class="btn-ghost" id="btn-sim" onclick="toggleSim()">营业模拟 …</button>
  <button class="btn-ghost" onclick="resetAll()">↺ 重置演示数据</button>
</div>

<div class="kpis">
  <div class="kpi"><div class="label">近30天营收</div><div class="value" id="kpi-revenue">–</div><div class="sub" id="sub-revenue"></div><div class="delta flat" id="d-revenue" style="display:none"></div></div>
  <div class="kpi"><div class="label">订单数（30天）</div><div class="value" id="kpi-orders">–</div><div class="sub" id="sub-orders"></div><div class="delta flat" id="d-orders" style="display:none"></div></div>
  <div class="kpi"><div class="label">客单价 AOV</div><div class="value" id="kpi-aov">–</div><div class="sub">近30天已完成订单</div></div>
  <div class="kpi"><div class="label">待审批变更</div><div class="value" id="kpi-pending">–</div><div class="sub">agent 提案 · 等你拍板</div></div>
</div>

<div class="insights-wrap">
  <div class="insights-head">💡 Copilot 洞察建议 <span class="ins-sub" id="ins-sub">主动扫描经营数据，一键派给 agent 处理（批准前数据不会变）</span></div>
  <div class="insights" id="insights"><div class="empty">加载中…</div></div>
</div>

<div class="cols">
  <div class="panel">
    <h2>📈 经营趋势
      <span class="right">
        <span class="seg"><button id="seg-rev" class="on" onclick="setMetric('revenue')">营收</button><button id="seg-ord" onclick="setMetric('orders')">订单量</button></span>
      </span>
    </h2>
    <div id="chart-wrap"><canvas id="chart"></canvas><div id="chart-tip"></div></div>
  </div>
  <div class="panel">
    <h2>🩺 数据质量体检</h2>
    <div id="dq"><div class="empty">加载中…</div></div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab on" data-tab="queue">📋 审批队列 <span class="badge-n zero" id="queue-n">0</span></button>
  <button class="tab" data-tab="products">📦 商品</button>
  <button class="tab" data-tab="agent">🤖 Copilot</button>
  <button class="tab" data-tab="audit">🧾 审计</button>
</div>
<div class="tabpanels">
  <div class="tabpanel on" id="tab-queue">
    <div class="filters" id="queue-filters">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="pending">待审批</button>
      <button class="chip" data-f="applied">已生效</button>
      <button class="chip" data-f="rejected">已拒绝</button>
    </div>
    <div id="staged"><div class="empty">加载中…</div></div>
  </div>
  <div class="tabpanel" id="tab-products">
    <div class="prod-controls">
      <input class="input" id="prod-search" placeholder="搜索商品名 / SKU / 标签…" style="min-width:230px">
      <select class="input" id="prod-cat"><option value="">全部类目</option></select>
      <select class="input" id="prod-status">
        <option value="">全部状态</option><option value="published">在售</option><option value="draft">未上架</option>
      </select>
      <span style="color:var(--faint);font-size:12px;align-self:center" id="prod-count"></span>
    </div>
    <div style="max-height:430px;overflow-y:auto">
      <table class="prod">
        <thead><tr><th>商品</th><th>类目</th><th>变体 / 价格 / 库存</th></tr></thead>
        <tbody id="prod-body"></tbody>
      </table>
    </div>
  </div>
  <div class="tabpanel" id="tab-agent">
    <div class="cop-grid">
      <div>
        <h2 style="font-size:13px;color:var(--muted);margin-bottom:10px">🎯 预设任务（脚本模式 · 无需 API key）</h2>
        <div id="presets"><div class="empty">加载中…</div></div>
        <h2 style="font-size:13px;color:var(--muted);margin:14px 0 8px">✨ 自由任务 <span id="llm-state" style="font-weight:400;font-size:11px"></span></h2>
        <div class="run-box">
          <input class="input" id="task-input" placeholder="用自然语言给 Copilot 派活…" disabled>
          <button class="btn-run" id="btn-run" onclick="runFreeTask()" disabled>运行</button>
        </div>
        <div class="hint" id="llm-hint"></div>
      </div>
      <div>
        <h2 style="font-size:13px;color:var(--muted);margin-bottom:10px">⚡ 执行轨迹</h2>
        <div id="job-area"><div class="empty">左侧选一个任务开始</div></div>
      </div>
    </div>
  </div>
  <div class="tabpanel" id="tab-audit">
    <div class="audit" id="audit"><div class="empty">加载中…</div></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';
// ================= 基础 =================
const $ = id => document.getElementById(id);
const fmtY = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = (type === 'ok' ? '✅ ' : type === 'bad' ? '⚠️ ' : '💡 ') + esc(msg);
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 320); }, 2800);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data: data || {} };
}

// ================= 数字滚动动画 =================
const counters = new Map(); // id -> 当前显示值
function setNum(id, target, fmt) {
  const el = $(id);
  const from = counters.has(id) ? counters.get(id) : 0;
  counters.set(id, target);
  if (from === target) { el.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 600;
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (target - from) * eased);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function setDelta(id, cur, prev) {
  const el = $(id);
  if (prev === undefined || prev === 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  const pct = (cur - prev) / prev * 100;
  el.className = 'delta ' + (pct > 1 ? 'up' : pct < -1 ? 'down' : 'flat');
  el.textContent = (pct > 0 ? '↑ ' : pct < 0 ? '↓ ' : '· ') + Math.abs(pct).toFixed(1) + '%';
}

// ================= 趋势图（canvas，无依赖）=================
let trend = [], metric = 'revenue', chartAnim = null, chartPoints = [];

function setMetric(m) {
  metric = m;
  $('seg-rev').classList.toggle('on', m === 'revenue');
  $('seg-ord').classList.toggle('on', m === 'orders');
  drawChart(true);
}

function drawChart(animate) {
  const cv = $('chart'), tip = $('chart-tip');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 210;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!trend.length) return;

  const pad = { l: 46, r: 12, t: 14, b: 24 };
  const data = trend.map(d => metric === 'revenue' ? d.revenue : d.orders);
  const max = Math.max(...data, 1) * 1.15;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const x = i => pad.l + iw * (i / (data.length - 1 || 1));
  const y = v => pad.t + ih * (1 - v / max);
  chartPoints = data.map((v, i) => ({ x: x(i), y: y(v), d: trend[i] }));

  // 网格与刻度
  ctx.font = '10.5px "Segoe UI"'; ctx.fillStyle = '#5c657a'; ctx.strokeStyle = 'rgba(48,58,82,.45)'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = pad.t + ih * g / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W - pad.r, gy); ctx.stroke();
    const val = max * (1 - g / 4);
    ctx.fillText(metric === 'revenue' ? (val >= 10000 ? (val / 1000).toFixed(0) + 'k' : Math.round(val)) : Math.round(val), 6, gy + 3.5);
  }
  ctx.fillText(trend[0].date, pad.l - 8, H - 8);
  ctx.fillText(trend[trend.length - 1].date, W - pad.r - 30, H - 8);

  const draw = (frac) => {
    const n = Math.max(2, Math.ceil(data.length * frac));
    const pts = chartPoints.slice(0, n);
    // 面积
    const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
    if (metric === 'revenue') { grad.addColorStop(0, 'rgba(91,140,255,.30)'); grad.addColorStop(1, 'rgba(91,140,255,0)'); }
    else { grad.addColorStop(0, 'rgba(61,220,151,.25)'); grad.addColorStop(1, 'rgba(61,220,151,0)'); }
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.lineTo(pts[pts.length - 1].x, H - pad.b); ctx.lineTo(pts[0].x, H - pad.b); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    // 线
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = metric === 'revenue' ? '#5b8cff' : '#3ddc97';
    ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    // 末点
    const last = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(last.x, last.y, 3.5, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    ctx.beginPath(); ctx.arc(last.x, last.y, 7, 0, 7); ctx.strokeStyle = ctx.strokeStyle; ctx.globalAlpha = .35; ctx.stroke(); ctx.globalAlpha = 1;
  };

  if (chartAnim) cancelAnimationFrame(chartAnim);
  if (animate) {
    const t0 = performance.now();
    (function frame(t) {
      const p = Math.min(1, (t - t0) / 650);
      draw(1 - Math.pow(1 - p, 3));
      if (p < 1) chartAnim = requestAnimationFrame(frame);
    })(t0);
  } else draw(1);

  cv.onmousemove = e => {
    const rect = cv.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let best = null, bd = 1e9;
    for (const p of chartPoints) { const d = Math.abs(p.x - mx); if (d < bd) { bd = d; best = p; } }
    if (!best || bd > 28) { tip.style.display = 'none'; return; }
    tip.style.display = 'block';
    tip.innerHTML = `<span style="color:var(--muted)">${best.d.date}</span><br><b>${metric === 'revenue' ? fmtY(best.d.revenue) : best.d.orders + ' 单'}</b><br><span style="color:var(--faint)">订单 ${best.d.orders} 笔</span>`;
    const tx = Math.min(best.x + 14, W - 130);
    tip.style.left = tx + 'px';
    tip.style.top = (best.y - 10) + 'px';
  };
  cv.onmouseleave = () => { tip.style.display = 'none'; };
}
window.addEventListener('resize', () => drawChart(false));

// ================= 数据加载与渲染 =================
const state = { analytics: null, staged: [], products: [], queueFilter: 'all' };

function renderKpis(a) {
  setNum('kpi-revenue', a.revenue, fmtY);
  setNum('kpi-orders', a.order_count, n => Math.round(n).toLocaleString());
  setNum('kpi-aov', a.aov, n => '¥' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','));
  const pending = state.staged.filter(c => c.status === 'pending').length;
  setNum('kpi-pending', pending, n => String(Math.round(n)));
  // 7d vs 前7d 对比（来自 trend）
  if (trend.length >= 14) {
    const sum = (arr, k) => arr.reduce((s, d) => s + d[k], 0);
    const cur = trend.slice(-7), prev = trend.slice(-14, -7);
    setDelta('d-revenue', sum(cur, 'revenue'), sum(prev, 'revenue'));
    $('sub-revenue').textContent = `近7天 ${fmtY(sum(cur, 'revenue'))}`;
    setDelta('d-orders', sum(cur, 'orders'), sum(prev, 'orders'));
    $('sub-orders').textContent = `近7天 ${sum(cur, 'orders')} 单`;
  }
  const badge = $('queue-n');
  badge.textContent = pending;
  badge.classList.toggle('zero', pending === 0);
  badge.style.transform = 'scale(1.25)';
  setTimeout(() => badge.style.transform = '', 200);
}

const ACTION_NAMES = { update_variant_price: '修改变价价格', update_product_title: '修改商品标题', update_product_description: '补全商品描述', restock_variant: '变体补货' };
ACTION_NAMES.update_variant_price = '修改变体价格';

function renderQueue() {
  const box = $('staged');
  let list = state.staged;
  if (state.queueFilter !== 'all') list = list.filter(c => c.status === state.queueFilter);
  if (!list.length) {
    box.innerHTML = `<div class="empty">队列空空如也 —— 去 <b style="color:var(--accent2);cursor:pointer" onclick="switchTab('agent')">🤖 Copilot</b> 派个活，或跑 <code>npm run demo</code></div>`;
    return;
  }
  box.innerHTML = list.map((c, i) => `
    <div class="chg ${c.status}" style="animation-delay:${Math.min(i * 40, 240)}ms">
      <div class="head">
        <span><span class="action">${ACTION_NAMES[c.action] || esc(c.action)}</span>&nbsp;&nbsp;<span class="id">${c.id}</span></span>
        <span class="badge ${c.status}">${({pending:'待审批', applied:'已生效', rejected:'已拒绝'})[c.status]}</span>
      </div>
      <div class="params">${esc(JSON.stringify(c.params, null, 1))}</div>
      ${c.reason ? `<div class="reason">${esc(c.reason)}</div>` : ''}
      ${c.status === 'pending' ? `
        <button class="btn btn-approve" onclick="decide('${c.id}','approve',this)">✓ 批准生效</button>
        <button class="btn btn-reject" onclick="decide('${c.id}','reject',this)">✕ 拒绝</button>` : ''}
    </div>`).join('');
}

async function decide(id, verb, btn) {
  btn.disabled = true;
  const { ok, data } = await api(`/admin/staged-changes/${id}/${verb}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ approved_by: '店主(运营台)' }),
  });
  if (ok) toast(verb === 'approve' ? `已生效：${id}` : `已拒绝：${id}`, 'ok');
  else toast(data.error || '操作失败', 'bad');
  refresh(true);
}

function renderQuality(dq) {
  const item = (tag, cls, main, sub) => `<div class="dq-item"><span><span class="tag ${cls}">${tag}</span>${esc(main)}</span><span class="muted">${esc(sub)}</span></div>`;
  let html = '';
  for (const z of dq.zero_price_variants) html += item('零价格', 'zero', z.product, z.sku);
  for (const l of dq.low_stock) html += item('低库存', 'low', l.product, `${l.sku} · 剩 ${l.inventory}`);
  for (const m of dq.missing_description) html += item('缺描述', 'desc', m.title, m.id);
  $('dq').innerHTML = html || '<div class="empty">数据质量良好 🎉</div>';
}

// ---------- 洞察建议 ----------
let insights = [], simOn = true;
const insTasks = {}; // insight_id -> 派给 Copilot 的自然语言任务

const INS_LEVEL = { danger: ['danger', '紧急'], warn: ['warn', '注意'], info: ['info', '建议'] };

function renderInsights() {
  const box = $('insights');
  $('ins-sub').textContent = simOn
    ? '营业模拟进行中 · 主动扫描数据，一键派给 agent（批准前数据不会变）'
    : '模拟已暂停（评测模式） · 一键派给 agent（批准前数据不会变）';
  if (!insights.length) {
    box.innerHTML = '<div class="ins-card info"><div class="ins-title">✅ 一切正常</div><div class="ins-detail">暂无需要关注的经营风险。新订单进来后会持续扫描。</div></div>';
    return;
  }
  box.innerHTML = insights.map((c, i) => `
    <div class="ins-card ${INS_LEVEL[c.level]?.[0] || 'info'}" style="animation-delay:${Math.min(i * 50, 300)}ms">
      <div class="ins-title">${c.icon} ${esc(c.title)}<span class="tag ${INS_LEVEL[c.level]?.[0]}" style="margin-left:8px">${INS_LEVEL[c.level]?.[1]}</span></div>
      <div class="ins-detail">${esc(c.detail)}</div>
      <div class="ins-actions">
        ${llmOk ? `<button class="btn-mini primary" onclick="runInsightTask('${c.id}')">🤖 让 Copilot 处理</button>` : ''}
        ${c.preset_id ? `<button class="btn-mini" onclick="runPreset('${c.preset_id}', this)" title="无需 API key 的预设修复任务">⚡ 免 key 预设修复</button>` : ''}
        ${!llmOk && !c.preset_id ? `<button class="btn-mini" disabled title="配置 LLM_API_KEY 后可用">需 LLM key</button>` : ''}
      </div>
    </div>`).join('');
}

async function runInsightTask(insightId) {
  if (currentJob) { toast('有任务在跑，稍等', 'bad'); return; }
  const task = insTasks[insightId];
  if (!task) return;
  switchTab('agent');
  const id = await startJob({ task });
  if (!id) return;
  currentJob = id;
  $('job-area').innerHTML = '<div class="empty">启动中…</div>';
  pollJob(id);
}

async function toggleSim() {
  const { ok, data } = await api('/admin/sim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on: !simOn }) });
  if (ok) {
    simOn = data.on;
    updateSimBtn();
    toast(simOn ? '营业模拟已恢复：新订单会持续进来' : '营业模拟已暂停：数据冻结（评测模式）', 'ok');
    refresh(true);
  } else toast('切换失败', 'bad');
}

function updateSimBtn() {
  const b = $('btn-sim');
  b.textContent = simOn ? '⏸ 暂停营业模拟' : '▶ 恢复营业模拟';
  b.classList.toggle('sim-on', simOn);
}

async function loadSimState() {
  const { ok, data } = await api('/admin/sim');
  if (ok) { simOn = !!data.on; updateSimBtn(); }
}

// ---------- 商品 ----------
function renderProducts() {
  const q = $('prod-search').value.trim().toLowerCase();
  const cat = $('prod-cat').value, st = $('prod-status').value;
  const list = state.products.filter(p =>
    (!q || p.title.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q)) || p.variants.some(v => v.sku.toLowerCase().includes(q))) &&
    (!cat || p.category === cat) && (!st || p.status === st));
  $('prod-count').textContent = `${list.length} / ${state.products.length} 个商品`;
  $('prod-body').innerHTML = list.map(p => {
    const variants = p.variants.map(v => {
      const danger = v.price <= 0 || v.inventory < 10;
      const invCls = v.inventory < 5 ? 'bad' : v.inventory < 10 ? 'warn' : '';
      return `<span class="vchip ${v.price <= 0 ? 'danger' : ''}" title="${esc(v.title)} · 库存 ${v.inventory}">${esc(v.sku)} <b>¥${v.price}</b><span class="inv-bar ${invCls}"><i style="width:${Math.min(100, v.inventory / 2)}%"></i></span>${v.inventory < 10 ? '⚠' : ''}</span>`;
    }).join('');
    const badges = (!p.description ? '<span class="tag desc">缺描述</span>' : '') + (p.status === 'draft' ? '<span class="tag low">未上架</span>' : '');
    return `<tr>
      <td><b>${esc(p.title)}</b> ${badges}<div style="color:var(--faint);font-size:11px;margin-top:2px">${p.id}</div></td>
      <td>${esc(p.category)}</td>
      <td>${variants}</td>
    </tr>`;
  }).join('');
}

// ---------- Copilot ----------
let llmOk = false, presets = [], currentJob = null, jobTimer = null;

const TYPE_META = { query: ['🔍', '查询'], analysis: ['📊', '分析'], write: ['✏️', '写提案'], long: ['🧭', '长程'] };

function renderPresets() {
  const groups = { query: [], analysis: [], write: [] };
  for (const p of presets) (groups[p.type] = groups[p.type] || []).push(p);
  $('presets').innerHTML = Object.entries(groups).map(([type, list]) => `
    <div class="preset-group">
      <div class="g-title">${TYPE_META[type]?.[0] || ''} ${TYPE_META[type]?.[1] || type}（${list.length}）</div>
      <div class="presets">${list.map(p => `
        <button class="preset" data-id="${p.id}" title="${esc(p.instruction)}" onclick="runPreset('${p.id}', this)">
          <span class="t">${TYPE_META[type]?.[0] || ''}</span>${esc(p.name)}
        </button>`).join('')}</div>
    </div>`).join('');
}

function updateLlmState(s) {
  llmOk = s.llm_available;
  $('task-input').disabled = !llmOk;
  $('btn-run').disabled = !llmOk;
  $('llm-state').innerHTML = llmOk
    ? `<span class="tag desc">已接入 ${esc(s.model || 'LLM')}</span>`
    : '<span class="tag low">未配置 key</span>';
  $('llm-hint').innerHTML = llmOk
    ? `模型：<code>${esc(s.model)}</code> · 任务会产生真实提案，仍需你在审批队列拍板`
    : `以 <code>LLM_API_KEY=xxx LLM_MODEL=yyy node server/store-server.js</code> 启动后，这里可以用自然语言派活（左侧预设任务无需 key，永远可用）`;
}

async function startJob(body) {
  const { ok, data } = await api('/agent/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!ok) { toast(data.error || '启动失败', 'bad'); return null; }
  return data.id;
}

function renderJob(job) {
  const box = $('job-area');
  const running = job.status === 'running';
  const steps = job.steps.map((s, i) => `
    <div class="step ${s.ok === false ? 'err' : ''}">
      <span class="t-icon">${s.ok === false ? '❌' : s.tool.startsWith('propose_') ? '✏️' : s.tool.includes('analytics') ? '📊' : s.tool.includes('orders') ? '🧾' : '🔍'}</span>
      <span><code>${esc(s.tool)}(${esc(JSON.stringify(s.args)).slice(0, 110)})</code>${s.error ? ' → ' + esc(s.error).slice(0, 80) : ''}</span>
    </div>`).join('');
  box.innerHTML = `
    <div style="font-size:13px;margin-bottom:9px;line-height:1.6">🎯 ${esc(job.task_text)}<br>
      <span style="color:var(--faint);font-size:11.5px">${job.id} · ${job.mode === 'llm' ? 'LLM ' + esc(job.model || '') : '脚本模式'} ${running ? '· <span style="color:var(--amber)">运行中…</span>' : ''}</span>
    </div>
    <div class="trace">${steps || '<div class="empty" style="padding:12px">思考中…</div>'}</div>
    ${job.answer != null ? `<div class="answer"><span class="who">🤖 Copilot${job.proposals ? ` · 产生 ${job.proposals} 条待审批提案<span class="goto-queue" onclick="switchTab('queue')">去审批 →</span>` : ''}</span>${esc(job.answer)}</div>` : ''}
    ${job.status === 'error' ? `<div class="answer" style="border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.06)"><span class="who" style="color:var(--red)">⚠️ 失败</span>${esc(job.error || '')}</div>` : ''}
    ${job.usage ? `<div class="job-meta">${job.steps.length} 次工具调用 · ${job.usage.prompt_tokens + job.usage.completion_tokens} tokens</div>` : ''}`;
}

async function pollJob(id) {
  const { ok, data } = await api('/agent/run/' + id);
  if (!ok) return;
  renderJob(data);
  if (data.status === 'running') { jobTimer = setTimeout(() => pollJob(id), 1200); }
  else {
    currentJob = null;
    toast(data.status === 'done' ? `任务完成：${id}` : `任务失败：${data.error?.slice(0, 60)}`, data.status === 'done' ? 'ok' : 'bad');
    refresh(true);
  }
}

async function runPreset(taskId, btn) {
  if (currentJob) { toast('有任务在跑，稍等', 'bad'); return; }
  if (btn) btn.disabled = true;
  switchTab('agent');
  const id = await startJob({ task_id: taskId });
  if (btn) setTimeout(() => btn.disabled = false, 1500);
  if (!id) return;
  currentJob = id;
  $('job-area').innerHTML = '<div class="empty">启动中…</div>';
  pollJob(id);
}

async function runFreeTask() {
  if (currentJob) { toast('有任务在跑，稍等', 'bad'); return; }
  const task = $('task-input').value.trim();
  if (!task) return;
  const id = await startJob({ task });
  if (!id) return;
  currentJob = id;
  $('task-input').value = '';
  $('job-area').innerHTML = '<div class="empty">启动中…</div>';
  pollJob(id);
}
$('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') runFreeTask(); });

// ---------- 审计 ----------
function renderAudit(list) {
  $('audit').innerHTML = list.map(x => `
    <div>${x.ts.slice(5, 19)} [<span class="who">${esc(x.actor)}</span>] <span class="ev">${esc(x.event)}</span> ${esc(x.detail.change_id || x.detail.path || x.detail.note || JSON.stringify(x.detail).slice(0, 70))}</div>`).join('');
}

// ---------- tabs ----------
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
  document.querySelectorAll('.tabpanel').forEach(p => p.classList.toggle('on', p.id === 'tab-' + name));
  if (name === 'audit') refresh(true);
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

document.querySelectorAll('#queue-filters .chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('#queue-filters .chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  state.queueFilter = c.dataset.f;
  renderQueue();
}));
['prod-search', 'prod-cat', 'prod-status'].forEach(id => {
  $(id).addEventListener('input', renderProducts);
  $(id).addEventListener('change', renderProducts);
});

// ---------- 重置 ----------
async function resetAll() {
  if (!confirm('重置会清空所有审批记录并恢复初始演示数据，确定？')) return;
  const { ok, data } = await api('/admin/reset', { method: 'POST' });
  toast(ok ? `已重置：${data.products} 商品 / ${data.orders} 订单` : '重置失败', ok ? 'ok' : 'bad');
  refresh(true);
}

// ---------- 轮询 ----------
let refreshing = false;
async function refresh(force) {
  if (refreshing) return;
  refreshing = true;
  try {
    const tasks = [api('/admin/analytics/summary?days=30'), api('/admin/revenue-trend?days=30'), api('/admin/staged-changes'), api('/admin/products'), api('/admin/insights')];
    if ($('tab-audit').classList.contains('on')) tasks.push(api('/admin/audit'));
    const [ana, tr, st, pr, ins, au] = await Promise.all(tasks);
    if (!ana.ok) throw new Error('server 不可达');
    $('live').classList.remove('down'); $('live-text').textContent = '已连接';

    const newTrend = tr.data.trend || [];
    const changed = !trend.length || JSON.stringify(newTrend) !== JSON.stringify(trend);
    trend = newTrend;
    state.analytics = ana.data;
    const stagedChanged = JSON.stringify(st.data.staged_changes) !== JSON.stringify(state.staged);
    state.staged = st.data.staged_changes;
    const prodChanged = JSON.stringify(pr.data.products) !== JSON.stringify(state.products);
    state.products = pr.data.products;

    renderKpis(ana.data);
    if (changed || force) drawChart(stagedChanged || force);
    renderQuality(ana.data.data_quality);
    if (stagedChanged || force) renderQueue();
    if (prodChanged || force) { fillCatFilter(); renderProducts(); }
    if (ins.ok) {
      const newList = ins.data.insights || [];
      const insChanged = JSON.stringify(newList) !== JSON.stringify(insights) || ins.data.sim_on !== simOn;
      if (insChanged || force) {
        insights = newList;
        for (const c of insights) insTasks[c.id] = c.task;
        renderInsights();
      }
    }
    if (au && au.ok) renderAudit(au.data.audit);
  } catch (e) {
    $('live').classList.add('down'); $('live-text').textContent = '连接断开，重试中…';
  }
  refreshing = false;
}

function fillCatFilter() {
  const sel = $('prod-cat');
  const cats = [...new Set(state.products.map(p => p.category))];
  const cur = sel.value;
  if (sel.options.length === cats.length + 1 && [...sel.options].every((o, i) => i === 0 || o.value === cats[i - 1])) return;
  sel.innerHTML = '<option value="">全部类目</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = cur;
}

let visible = true;
document.addEventListener('visibilitychange', () => {
  visible = !document.hidden;
  if (visible) refresh(true);
});

// SSE 实时推送：服务端状态变化立刻通知，轮询只做降级兜底
let sseOk = false;
function connectSSE() {
  try {
    const es = new EventSource('/events');
    es.addEventListener('refresh', () => { if (visible) refresh(false); });
    es.onopen = () => { if (!sseOk) { sseOk = true; $('live-text').textContent = '实时推送'; } };
    es.onerror = () => { sseOk = false; $('live-text').textContent = '已连接（轮询）'; };
  } catch { sseOk = false; }
}
connectSSE();

(async function init() {
  await loadSimState();
  await refresh(true);
  setInterval(() => { if (visible && !sseOk) refresh(false); }, 4000);
  const [st, ps] = await Promise.all([api('/agent/status'), api('/agent/presets')]);
  if (st.ok) updateLlmState(st.data);
  if (ps.ok) { presets = ps.data.presets; renderPresets(); }
  renderInsights();
})();
</script>
