<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺运营台 · Copilot Console</title>
<style>
  /* ============ 设计系统（Linear/Vercel/shadcn 暗色语言）============ */
  :root {
    --bg: #090b0f;            /* 页面底 */
    --surface: #0f1218;       /* 侧边栏 */
    --card: #12151c;          /* 卡片 */
    --card-hover: #171b24;
    --elev: #191e29;          /* 内嵌块 */
    --line: rgba(255,255,255,.065);
    --line-strong: rgba(255,255,255,.13);
    --text: #eef1f7;
    --text-2: #a3abc0;
    --text-3: #646d84;
    --accent: #818cf8;        /* indigo-400 */
    --accent-strong: #6366f1;
    --accent-soft: rgba(129,140,248,.13);
    --brand-grad: linear-gradient(135deg, #818cf8, #c084fc);
    --green: #34d399; --red: #f87171; --amber: #fbbf24; --cyan: #22d3ee;
    --r-lg: 16px; --r: 12px; --r-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --sidebar-w: 236px;
    --topbar-h: 58px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    animation: pageIn .4s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.09); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.16); }
  ::selection { background: rgba(129,140,248,.35); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button { font-family: inherit; }

  /* ============ 布局骨架 ============ */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static !important; width: auto !important; height: auto !important;
      flex-direction: row !important; align-items: center; padding: 10px 14px !important; gap: 12px; }
    .nav { display: flex !important; flex-direction: row; overflow-x: auto; gap: 4px; }
    .nav-label, .sidebar .foot { display: none; }
    .main { margin-left: 0 !important; }
  }

  /* ============ 侧边栏 ============ */
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px 12px; z-index: 50;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; }
  .logo .ico {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--brand-grad); font-size: 17px; box-shadow: 0 4px 14px rgba(129,140,248,.35);
  }
  .logo .name { font-weight: 700; font-size: 14.5px; letter-spacing: .2px; }
  .logo .ver { font-size: 10px; color: var(--text-3); margin-top: 1px; }
  .nav-label { font-size: 10.5px; color: var(--text-3); letter-spacing: 1.2px; padding: 14px 12px 7px; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm);
    color: var(--text-2); cursor: pointer; border: none; background: none; width: 100%;
    font-size: 13.3px; text-align: left; transition: all .15s ease; position: relative;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,.045); }
  .nav-item.on { color: var(--text); background: var(--accent-soft); }
  .nav-item.on::before {
    content: ''; position: absolute; left: -12px; top: 20%; bottom: 20%; width: 3px;
    border-radius: 3px; background: var(--brand-grad);
  }
  .nav-item .n-ico { width: 18px; text-align: center; font-size: 14px; opacity: .9; }
  .nav-item .n-badge {
    margin-left: auto; min-width: 19px; text-align: center; font-size: 10.5px; font-weight: 700;
    background: var(--amber); color: #2a1e00; border-radius: 20px; padding: 1.5px 6px;
    transition: transform .2s cubic-bezier(.3,1.6,.4,1);
  }
  .nav-item .n-badge.zero { background: transparent; color: var(--text-3); }
  .nav-item .n-badge.pop { transform: scale(1.3); }
  .sidebar .foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--line); }
  .foot .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); padding: 6px 0; }
  .foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2.2s infinite; }
  .foot.down .dot { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,.45); } 50% { box-shadow: 0 0 0 5px rgba(52,211,153,0); } }
  .foot .ver-line { font-size: 10.5px; color: var(--text-3); padding: 2px 0; }
  .foot .btn-ghost { width: 100%; margin-top: 8px; justify-content: center; }
  .foot .sim-row { padding: 6px 0; }

  /* ============ 主区 ============ */
  .main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 40; height: var(--topbar-h);
    display: flex; align-items: center; gap: 14px; padding: 0 28px;
    background: rgba(9,11,15,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .t-title { font-weight: 650; font-size: 15.5px; letter-spacing: .2px; }
  .topbar .t-sub { color: var(--text-3); font-size: 12.3px; }
  .topbar .right { margin-left: auto; display: flex; gap: 9px; align-items: center; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-2);
    padding: 6.5px 13px; border-radius: var(--r-sm); font-size: 12.5px; cursor: pointer;
    transition: all .16s ease;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .btn-ghost.sim-on { color: var(--green); border-color: rgba(52,211,153,.4); }
  .content { padding: 26px 28px 48px; max-width: 1460px; }
  .view { display: none; }
  .view.on { display: block; animation: viewIn .32s cubic-bezier(.2,.7,.3,1); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ============ 通用组件 ============ */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 18px 20px; transition: border-color .18s ease;
  }
  .panel:hover { border-color: var(--line-strong); }
  .panel h2 {
    font-size: 13px; color: var(--text-2); font-weight: 600; letter-spacing: .3px;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .panel h2 .right { margin-left: auto; }
  .seg { display: flex; background: var(--elev); border-radius: 8px; padding: 2.5px; }
  .seg button {
    border: none; background: transparent; color: var(--text-2); font-size: 11.5px;
    padding: 4.5px 12px; border-radius: 6px; cursor: pointer; transition: all .15s ease;
  }
  .seg button.on { background: var(--accent-strong); color: #fff; }
  .empty { color: var(--text-3); font-size: 13px; padding: 26px; text-align: center; line-height: 1.8; }
  .empty b { color: var(--accent); cursor: pointer; }
  .empty code { background: var(--elev); padding: 1px 7px; border-radius: 5px; color: var(--accent); }
  .tag { display: inline-block; font-size: 10.5px; padding: 1.5px 8px; border-radius: 5px; font-weight: 600; }
  .tag.low { background: rgba(251,191,36,.12); color: var(--amber); }
  .tag.zero { background: rgba(248,113,113,.12); color: var(--red); }
  .tag.desc { background: rgba(34,211,238,.12); color: var(--cyan); }
  .chip {
    border: 1px solid var(--line-strong); background: transparent; color: var(--text-2);
    font-size: 12px; padding: 4.5px 14px; border-radius: 20px; cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn-mini {
    border: 1px solid var(--line-strong); background: var(--elev); color: var(--text);
    font-size: 11.8px; padding: 5.5px 12px; border-radius: 7px; cursor: pointer; transition: all .15s ease; font-weight: 500;
  }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
  .btn-mini:disabled { opacity: .45; cursor: wait; }
  .btn-mini.primary { background: var(--accent-soft); border-color: rgba(129,140,248,.45); color: var(--accent); }
  .btn-mini.primary:hover { background: rgba(129,140,248,.24); }
  .input, select.input {
    background: var(--elev); border: 1px solid var(--line-strong); color: var(--text);
    border-radius: var(--r-sm); padding: 7.5px 12px; font-size: 12.8px; outline: none; transition: border-color .15s ease;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129,140,248,.12); }
  .skel { position: relative; overflow: hidden; background: var(--elev); border-radius: 8px; }
  .skel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(163,171,192,.08), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .skel-row { height: 14px; margin: 12px 4px; }

  /* ============ KPI ============ */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi {
    background: linear-gradient(180deg, rgba(255,255,255,.025), transparent) , var(--card);
    border: 1px solid var(--line); border-radius: var(--r-lg); padding: 17px 19px;
    position: relative; overflow: hidden; transition: transform .18s ease, border-color .18s ease;
  }
  .kpi:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .kpi::after {
    content: ''; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px;
    border-radius: 50%; background: radial-gradient(circle, rgba(129,140,248,.07), transparent 70%);
    pointer-events: none;
  }
  .kpi .label { color: var(--text-3); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 9px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .kpi .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .kpi .sub { color: var(--text-3); font-size: 11.5px; margin-top: 6px; }
  .kpi .delta { position: absolute; top: 17px; right: 17px; font-size: 11.5px; font-weight: 600; padding: 2.5px 9px; border-radius: 20px; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--green); background: rgba(52,211,153,.1); }
  .delta.down { color: var(--red); background: rgba(248,113,113,.1); }
  .delta.flat { color: var(--text-3); background: var(--elev); }

  /* ============ 洞察 ============ */
  .insights-wrap { margin-bottom: 18px; }
  .insights-head { font-size: 13px; color: var(--text-2); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .ins-sub { font-weight: 400; font-size: 11.5px; color: var(--text-3); }
  .insights { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .ins-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 14px 16px; border-left-width: 3px;
    animation: cardIn .35s ease; transition: transform .18s ease, border-color .18s ease;
    display: flex; flex-direction: column; gap: 7px;
  }
  .ins-card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .ins-card.danger { border-left-color: var(--red); background: linear-gradient(180deg, rgba(248,113,113,.05), var(--card)); }
  .ins-card.warn { border-left-color: var(--amber); background: linear-gradient(180deg, rgba(251,191,36,.04), var(--card)); }
  .ins-card.info { border-left-color: var(--cyan); }
  .ins-title { font-size: 13.2px; font-weight: 600; line-height: 1.45; }
  .ins-detail { font-size: 12.2px; color: var(--text-2); line-height: 1.65; flex: 1; }
  .ins-actions { display: flex; gap: 7px; flex-wrap: wrap; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ============ 图表/质量 ============ */
  .overview-grid { display: grid; grid-template-columns: 5fr 2fr; gap: 14px; }
  #chart-wrap { position: relative; }
  #chart { width: 100%; height: 220px; display: block; cursor: crosshair; }
  #chart-tip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(15,18,24,.96); border: 1px solid var(--line-strong); border-radius: 9px;
    padding: 9px 12px; font-size: 12px; white-space: nowrap; z-index: 5;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #chart-tip b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .dq-item { display: flex; justify-content: space-between; align-items: center; padding: 8.5px 0; border-bottom: 1px dashed var(--line); font-size: 12.8px; animation: cardIn .3s ease; }
  .dq-item:last-child { border-bottom: none; }
  .dq-item .muted { color: var(--text-3); font-family: Consolas, monospace; font-size: 11.5px; }

  /* ============ 审批队列 ============ */
  .filters { display: flex; gap: 8px; margin-bottom: 15px; }
  .chg {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: var(--r); padding: 14px 16px; margin-bottom: 11px;
    animation: cardIn .3s ease; transition: border-color .18s ease, transform .18s ease;
  }
  .chg:hover { border-color: var(--line-strong); transform: translateX(2px); }
  .chg.applied { border-left-color: var(--green); }
  .chg.rejected { border-left-color: var(--red); opacity: .65; }
  .chg-top { display: flex; gap: 14px; align-items: flex-start; }
  .chg-ico {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-size: 17px;
    background: var(--elev); border: 1px solid var(--line);
  }
  .chg-body { flex: 1; min-width: 0; }
  .chg-title { font-weight: 600; font-size: 13.8px; line-height: 1.55; }
  .chg-title b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .chg-reason { color: var(--text-2); font-size: 12.4px; margin-top: 5px; line-height: 1.6; }
  .chg-side { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; flex: none; }
  .chg-btns { display: flex; gap: 8px; }
  details.chg-tech { margin-top: 11px; }
  details.chg-tech summary {
    cursor: pointer; font-size: 11.5px; color: var(--text-3); list-style: none;
    display: inline-flex; align-items: center; gap: 5px; user-select: none;
  }
  details.chg-tech summary::-webkit-details-marker { display: none; }
  details.chg-tech summary::before { content: '▸'; transition: transform .15s ease; }
  details.chg-tech[open] summary::before { transform: rotate(90deg); }
  details.chg-tech summary:hover { color: var(--text-2); }
  details.chg-tech .params { margin-top: 8px; }
  .chg-meta { font-family: Consolas, monospace; font-size: 11px; color: var(--text-3); margin-top: 6px; }
  .chg .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .chg .action { font-weight: 600; font-size: 13.5px; }
  .chg .id { color: var(--text-3); font-size: 11.5px; font-family: Consolas, monospace; }
  .badge { font-size: 11px; padding: 2.5px 10px; border-radius: 20px; background: rgba(251,191,36,.12); color: var(--amber); font-weight: 600; }
  .badge.applied { background: rgba(52,211,153,.12); color: var(--green); }
  .badge.rejected { background: rgba(248,113,113,.12); color: var(--red); }
  .chg .params {
    font-family: Consolas, monospace; font-size: 12px; color: #b9c2d4;
    background: #0b0e13; border-radius: 7px; padding: 9px 12px; margin: 8px 0;
    white-space: pre-wrap; word-break: break-all; border: 1px solid var(--line);
  }
  .chg .reason { color: var(--text-2); font-size: 12.4px; margin-bottom: 10px; }
  .chg .reason::before { content: '💬 '; opacity: .7; }
  .btn {
    border: none; border-radius: 8px; padding: 7.5px 17px; font-size: 12.8px; cursor: pointer;
    margin-right: 8px; font-weight: 600; transition: all .16s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn-approve { background: var(--green); color: #06240f; box-shadow: 0 2px 10px rgba(52,211,153,.25); }
  .btn-approve:hover { box-shadow: 0 4px 16px rgba(52,211,153,.4); }
  .btn-reject { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,.5); }
  .btn-reject:hover { background: rgba(248,113,113,.1); }
  .btn:disabled { opacity: .4; cursor: wait; }

  /* ============ 商品 ============ */
  .prod-controls { display: flex; gap: 9px; margin-bottom: 13px; flex-wrap: wrap; align-items: center; }
  table.prod { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  table.prod th { text-align: left; color: var(--text-3); font-weight: 500; font-size: 11.5px; padding: 7px 9px; border-bottom: 1px solid var(--line); }
  table.prod td { padding: 8.5px 9px; border-bottom: 1px dashed var(--line); }
  table.prod tr:hover td { background: rgba(129,140,248,.04); }
  .inv-bar { width: 72px; height: 5px; background: var(--elev); border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 7px; overflow: hidden; }
  .inv-bar i { display: block; height: 100%; border-radius: 4px; background: var(--green); transition: width .5s cubic-bezier(.4,0,.2,1); }
  .inv-bar.warn i { background: var(--amber); }
  .inv-bar.bad i { background: var(--red); }
  .vchip {
    display: inline-block; font-family: Consolas, monospace; font-size: 11px; color: var(--text-2);
    background: var(--elev); border: 1px solid var(--line); border-radius: 6px; padding: 2.5px 8px; margin: 2px 4px 2px 0;
  }
  .vchip b { color: var(--text); font-weight: 600; }
  .vchip.danger { border-color: rgba(248,113,113,.5); color: var(--red); }

  /* ============ 竞品价格 ============ */
  .mkt-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 15px; }
  .mkt-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 16px; }
  .mkt-card .n { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mkt-card .t { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
  .mkt-card.hot .n { color: var(--red); } .mkt-card.cheap .n { color: var(--green); }
  .mkt-card.fair .n { color: var(--cyan); } .mkt-card.sug .n { color: var(--amber); }
  .mkt-grid { display: grid; grid-template-columns: 11fr 9fr; gap: 14px; align-items: start; }
  table.mkt { width: 100%; border-collapse: collapse; font-size: 12.6px; }
  table.mkt th { text-align: left; color: var(--text-3); font-weight: 500; font-size: 11.5px; padding: 7px 9px; border-bottom: 1px solid var(--line); }
  table.mkt td { padding: 8.5px 9px; border-bottom: 1px dashed var(--line); }
  table.mkt tr { cursor: pointer; transition: background .14s ease; }
  table.mkt tr:hover td { background: rgba(129,140,248,.05); }
  table.mkt tr.sel td { background: rgba(129,140,248,.1); }
  .range { position: relative; height: 8px; background: var(--elev); border-radius: 5px; width: 130px; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .range .marker { position: absolute; top: -3px; width: 3px; height: 14px; border-radius: 2px; background: var(--amber); box-shadow: 0 0 6px rgba(251,191,36,.7); }
  .range.over .marker { background: var(--red); box-shadow: 0 0 6px rgba(248,113,113,.7); }
  .range.under .marker { background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,.7); }
  .pos-chip { font-size: 11px; padding: 1.5px 7px; border-radius: 5px; font-weight: 600; }
  .pos-chip.over { color: var(--red); background: rgba(248,113,113,.12); }
  .pos-chip.under { color: var(--green); background: rgba(52,211,153,.12); }
  .pos-chip.fair { color: var(--cyan); background: rgba(34,211,238,.1); }
  .trend-up { color: var(--green); } .trend-down { color: var(--red); } .trend-flat { color: var(--text-2); }
  .suggest-card {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: var(--r); padding: 13px 15px; margin-bottom: 10px; animation: cardIn .3s ease;
  }
  .suggest-card.decrease { border-left-color: var(--green); }
  .suggest-card.increase { border-left-color: var(--amber); }
  .suggest-card.hold { border-left-color: var(--text-3); opacity: .8; }
  .sg-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
  .sg-title { font-weight: 600; font-size: 13.2px; }
  .sg-arrow { font-family: Consolas, monospace; font-size: 13px; color: var(--accent); }
  .sg-reason { color: var(--text-2); font-size: 12.3px; line-height: 1.6; margin: 5px 0 8px; }
  .sg-impact { display: flex; gap: 15px; font-size: 12px; background: var(--elev); border-radius: 7px; padding: 8px 12px; margin-bottom: 9px; flex-wrap: wrap; }
  .sg-impact b { font-variant-numeric: tabular-nums; }
  .impact-pos { color: var(--green); } .impact-neg { color: var(--red); } .impact-zero { color: var(--text-2); }
  #mkt-detail { min-height: 330px; }
  #mkt-canvas { width: 100%; height: 235px; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-2); margin-top: 9px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .assumption { font-size: 11.3px; color: var(--text-3); line-height: 1.7; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); }

  /* ============ Copilot ============ */
  .cop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .preset-group { margin-bottom: 13px; }
  .preset-group .g-title { font-size: 11.5px; color: var(--text-3); margin-bottom: 7px; letter-spacing: .4px; }
  .presets { display: flex; flex-wrap: wrap; gap: 7px; }
  .preset {
    border: 1px solid var(--line-strong); background: var(--card); color: var(--text);
    font-size: 12.3px; padding: 6.5px 13px; border-radius: 9px; cursor: pointer; transition: all .16s ease;
    animation: cardIn .35s ease;
  }
  .preset:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .preset:disabled { opacity: .45; cursor: wait; transform: none; }
  .preset .t { font-size: 10px; margin-right: 6px; }
  .run-box { display: flex; gap: 8px; margin-top: 4px; }
  .run-box .input { flex: 1; }
  .btn-run {
    background: var(--brand-grad); color: #fff; border: none;
    border-radius: 8px; padding: 7.5px 19px; font-size: 12.8px; font-weight: 600; cursor: pointer; transition: all .18s ease;
    box-shadow: 0 2px 12px rgba(129,140,248,.3);
  }
  .btn-run:hover { box-shadow: 0 4px 20px rgba(129,140,248,.45); transform: translateY(-1px); }
  .btn-run:disabled { opacity: .5; cursor: wait; transform: none; }
  .trace { margin-top: 13px; }
  .step {
    display: flex; gap: 9px; align-items: baseline; font-size: 12.6px; padding: 6px 0 6px 4px;
    border-left: 2px solid var(--line-strong); margin-left: 6px; padding-left: 13px;
    animation: cardIn .3s ease; color: var(--text-2);
  }
  .step .t-icon { font-size: 13px; }
  .step code { font-family: Consolas, monospace; color: var(--accent); font-size: 11.8px; word-break: break-all; }
  .step.err code { color: var(--red); }
  .answer {
    margin-top: 12px; background: linear-gradient(180deg, rgba(129,140,248,.08), rgba(129,140,248,.03));
    border: 1px solid rgba(129,140,248,.25); border-radius: var(--r); padding: 13px 16px;
    font-size: 13.2px; line-height: 1.68; animation: cardIn .35s ease; white-space: pre-wrap;
  }
  .answer .who { color: var(--accent); font-weight: 700; font-size: 12px; display: block; margin-bottom: 6px; }
  .job-meta { margin-top: 10px; color: var(--text-3); font-size: 11.5px; font-family: Consolas, monospace; }
  .goto-queue { margin-left: 10px; color: var(--amber); cursor: pointer; font-size: 12.3px; text-decoration: underline; text-underline-offset: 3px; }
  .hint { color: var(--text-3); font-size: 12px; margin-top: 10px; line-height: 1.7; }

  /* ============ 审计 ============ */
  .audit { font-size: 12px; color: var(--text-2); font-family: Consolas, monospace; max-height: 480px; overflow-y: auto; }
  .audit div { padding: 5.5px 2px; border-bottom: 1px dashed var(--line); animation: cardIn .3s ease; }
  .audit .ev { color: var(--accent); }
  .audit .who { color: var(--cyan); }

  /* ============ toasts ============ */
  .toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 9px; z-index: 99; }
  .toast {
    background: var(--elev); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 11px 16px; font-size: 13px; min-width: 240px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2); display: flex; gap: 9px; align-items: center;
  }
  .toast.ok { border-color: rgba(52,211,153,.5); }
  .toast.bad { border-color: rgba(248,113,113,.5); }
  .toast.leaving { transition: all .3s ease; opacity: 0; transform: translateX(30px); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

  /* ============ splash ============ */
  #splash {
    position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
    background: var(--bg); transition: opacity .5s ease, visibility .5s;
  }
  #splash.hide { opacity: 0; visibility: hidden; }
  #splash .mark { font-size: 21px; font-weight: 700; letter-spacing: 1px; animation: splashPulse 1.2s ease infinite; }
  #splash .mark b { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes splashPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .overview-grid, .mkt-grid, .cop-grid { grid-template-columns: 1fr; }
  }
</style>

<script>
'use strict';
// ================= 基础 =================
const $ = id => document.getElementById(id);
const fmtY = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = (type === 'ok' ? '✅ ' : type === 'bad' ? '⚠️ ' : '💡 ') + esc(msg);
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 320); }, 2800);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data: data || {} };
}

// ================= 数字滚动动画 =================
const counters = new Map();
function setNum(id, target, fmt) {
  const el = $(id);
  const from = counters.has(id) ? counters.get(id) : 0;
  counters.set(id, target);
  if (from === target) { el.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 600;
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (target - from) * eased);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function setDelta(id, cur, prev) {
  const el = $(id);
  if (prev === undefined || prev === 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  const pct = (cur - prev) / prev * 100;
  el.className = 'delta ' + (pct > 1 ? 'up' : pct < -1 ? 'down' : 'flat');
  el.textContent = (pct > 0 ? '↑ ' : pct < 0 ? '↓ ' : '· ') + Math.abs(pct).toFixed(1) + '%';
}

// ================= 趋势图（canvas，无依赖）=================
let trend = [], metric = 'revenue', chartAnim = null, chartPoints = [];

function setMetric(m) {
  metric = m;
  $('seg-rev').classList.toggle('on', m === 'revenue');
  $('seg-ord').classList.toggle('on', m === 'orders');
  drawChart(true);
}

function drawChart(animate) {
  const cv = $('chart'), tip = $('chart-tip');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 220;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!trend.length) return;

  const pad = { l: 46, r: 12, t: 14, b: 24 };
  const data = trend.map(d => metric === 'revenue' ? d.revenue : d.orders);
  const max = Math.max(...data, 1) * 1.15;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const x = i => pad.l + iw * (i / (data.length - 1 || 1));
  const y = v => pad.t + ih * (1 - v / max);
  chartPoints = data.map((v, i) => ({ x: x(i), y: y(v), d: trend[i] }));

  ctx.font = '10.5px "Segoe UI"'; ctx.fillStyle = '#646d84'; ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = pad.t + ih * g / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W - pad.r, gy); ctx.stroke();
    const val = max * (1 - g / 4);
    ctx.fillText(metric === 'revenue' ? (val >= 10000 ? (val / 1000).toFixed(0) + 'k' : Math.round(val)) : Math.round(val), 6, gy + 3.5);
  }
  ctx.fillText(trend[0].date, pad.l - 8, H - 8);
  ctx.fillText(trend[trend.length - 1].date, W - pad.r - 30, H - 8);

  const draw = (frac) => {
    const n = Math.max(2, Math.ceil(data.length * frac));
    const pts = chartPoints.slice(0, n);
    const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
    if (metric === 'revenue') { grad.addColorStop(0, 'rgba(129,140,248,.32)'); grad.addColorStop(1, 'rgba(129,140,248,0)'); }
    else { grad.addColorStop(0, 'rgba(52,211,153,.25)'); grad.addColorStop(1, 'rgba(52,211,153,0)'); }
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.lineTo(pts[pts.length - 1].x, H - pad.b); ctx.lineTo(pts[0].x, H - pad.b); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = metric === 'revenue' ? '#818cf8' : '#34d399';
    ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    const last = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(last.x, last.y, 3.5, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    ctx.beginPath(); ctx.arc(last.x, last.y, 7, 0, 7); ctx.strokeStyle = ctx.strokeStyle; ctx.globalAlpha = .35; ctx.stroke(); ctx.globalAlpha = 1;
  };

  if (chartAnim) cancelAnimationFrame(chartAnim);
  if (animate) {
    const t0 = performance.now();
    (function frame(t) {
      const p = Math.min(1, (t - t0) / 650);
      draw(1 - Math.pow(1 - p, 3));
      if (p < 1) chartAnim = requestAnimationFrame(frame);
    })(t0);
  } else draw(1);

  cv.onmousemove = e => {
    const rect = cv.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let best = null, bd = 1e9;
    for (const p of chartPoints) { const d = Math.abs(p.x - mx); if (d < bd) { bd = d; best = p; } }
    if (!best || bd > 28) { tip.style.display = 'none'; return; }
    tip.style.display = 'block';
    tip.innerHTML = `<span style="color:var(--text-2)">${best.d.date}</span><br><b>${metric === 'revenue' ? fmtY(best.d.revenue) : best.d.orders + ' 单'}</b><br><span style="color:var(--text-3)">订单 ${best.d.orders} 笔</span>`;
    const tx = Math.min(best.x + 14, W - 130);
    tip.style.left = tx + 'px';
    tip.style.top = (best.y - 10) + 'px';
  };
  cv.onmouseleave = () => { tip.style.display = 'none'; };
}
window.addEventListener('resize', () => drawChart(false));

// ================= 数据加载与渲染 =================
const state = { analytics: null, staged: [], products: [], queueFilter: 'all' };

const VIEW_META = {
  overview: ['经营总览', '店铺的核心指标、Copilot 洞察与经营趋势'],
  queue: ['审批队列', 'agent 的提案在这里排队——批准后才会真实生效'],
  products: ['商品', '浏览全部商品，搜索（支持 SKU）/ 类目 / 状态过滤'],
  market: ['竞品价格', '市场价格带对比与改价建议（含预期影响测算）'],
  agent: ['Copilot', '给智能体派活：预设任务免 key，自由任务需 LLM key'],
  audit: ['审计日志', '每次提案 / 批准 / 拒绝 / 围栏拦截全留痕'],
};

function switchView(name) {
  document.querySelectorAll('.nav-item').forEach(t => t.classList.toggle('on', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(p => p.classList.toggle('on', p.id === 'view-' + name));
  const meta = VIEW_META[name];
  if (meta) { $('t-title').textContent = meta[0]; $('t-sub') && ($('t-sub').textContent = meta[1]); }
  if (name === 'audit') refresh(true);
  if (name === 'market' && market) { renderMarket(); if (mktSel) selectProduct(mktSel); }
  if (name === 'overview') drawChart(false);
  history.replaceState(null, '', '#' + name);
}
document.querySelectorAll('.nav-item').forEach(t => t.addEventListener('click', () => switchView(t.dataset.view)));

function renderKpis(a) {
  setNum('kpi-revenue', a.revenue, fmtY);
  setNum('kpi-orders', a.order_count, n => Math.round(n).toLocaleString());
  setNum('kpi-aov', a.aov, n => '¥' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','));
  const pending = state.staged.filter(c => c.status === 'pending').length;
  setNum('kpi-pending', pending, n => String(Math.round(n)));
  if (trend.length >= 14) {
    const sum = (arr, k) => arr.reduce((s, d) => s + d[k], 0);
    const cur = trend.slice(-7), prev = trend.slice(-14, -7);
    setDelta('d-revenue', sum(cur, 'revenue'), sum(prev, 'revenue'));
    $('sub-revenue').textContent = `近7天 ${fmtY(sum(cur, 'revenue'))}`;
    setDelta('d-orders', sum(cur, 'orders'), sum(prev, 'orders'));
    $('sub-orders').textContent = `近7天 ${sum(cur, 'orders')} 单`;
  }
  const badge = $('queue-n');
  badge.textContent = pending;
  badge.classList.toggle('zero', pending === 0);
  badge.classList.add('pop');
  setTimeout(() => badge.classList.remove('pop'), 220);
}

const ACTION_NAMES = { update_variant_price: '修改变体价格', update_product_title: '修改商品标题', update_product_description: '补全商品描述', restock_variant: '变体补货' };

// 把变更翻译成人话（价格/标题/描述/库存），内部 ID 全部藏进「技术详情」
const ACTION_ICON = { update_variant_price: '💰', update_product_title: '📝', update_product_description: '📄', restock_variant: '📦' };

function findVariantRef(ref) {
  for (const p of state.products) {
    const v = p.variants.find(v => v.id === ref || v.sku === ref);
    if (v) return { product: p, variant: v };
  }
  return null;
}
const refName = (hit) => hit ? `「${hit.product.title} · ${hit.variant.title}」` : '';

function friendlyChange(c) {
  const params = c.params || {};
  if (c.action === 'update_variant_price') {
    const hit = findVariantRef(params.variant_id);
    const before = hit && hit.variant.price > 0 ? `现价 ¥${hit.variant.price} → ` : '';
    return { icon: '💰', title: `把${refName(hit) || '「' + (params.variant_id || '?') + '」'}的价格 ${before}调整为 <b>¥${params.price}</b>` };
  }
  if (c.action === 'update_product_title') {
    const p = state.products.find(x => x.id === params.product_id);
    return { icon: '📝', title: `把「${p ? p.title : params.product_id || '?'}」的标题改为 <b>「${params.title}」</b>` };
  }
  if (c.action === 'update_product_description') {
    const p = state.products.find(x => x.id === params.product_id);
    return { icon: '📄', title: `为「${p ? p.title : params.product_id || '?'}」<b>补全商品描述</b>` };
  }
  if (c.action === 'restock_variant') {
    const hit = findVariantRef(params.variant_id);
    const before = hit ? `当前 ${hit.variant.inventory} 件 → ` : '';
    return { icon: '📦', title: `把${refName(hit) || '「' + (params.variant_id || '?') + '」'}的库存 ${before}调整为 <b>${params.inventory} 件</b>` };
  }
  return { icon: '⚙️', title: esc(c.action) };
}

function renderQueue() {
  const box = $('staged');
  let list = [...state.staged];
  if (state.queueFilter !== 'all') list = list.filter(c => c.status === state.queueFilter);
  // 待审批永远在最前，其余按时间倒序——不让历史卡片淹没需要拍板的提案
  const rank = { pending: 0, applied: 1, rejected: 2 };
  list.sort((a, b) => (rank[a.status] ?? 3) - (rank[b.status] ?? 3) || String(b.created_at).localeCompare(String(a.created_at)));
  if (!list.length) {
    box.innerHTML = `<div class="empty">队列空空如也 —— 去 <b onclick="switchView('agent')">🤖 Copilot</b> 派个活，或跑 <code>npm run -s demo</code></div>`;
    return;
  }
  box.innerHTML = list.map((c, i) => {
    const f = friendlyChange(c);
    const badgeTxt = ({pending:'待审批', applied:'已生效', rejected:'已拒绝'})[c.status];
    return `
    <div class="chg ${c.status}" style="animation-delay:${Math.min(i * 40, 240)}ms">
      <div class="chg-top">
        <div class="chg-ico">${f.icon}</div>
        <div class="chg-body">
          <div class="chg-title">${f.title}</div>
          ${c.reason ? `<div class="chg-reason">${esc(c.reason)}</div>` : ''}
          <details class="chg-tech">
            <summary>技术详情</summary>
            <div class="params">${esc(JSON.stringify(c.params, null, 1))}</div>
            <div class="chg-meta">${c.id} · ${c.action} · 提案于 ${(c.created_at || '').slice(0, 19).replace('T', ' ')}${c.decided_by ? ' · ' + c.decided_by + (c.decided_at ? ' 处理' : '') : ''}</div>
          </details>

      <span style="margin-left:auto">市场锚点 ≈ ¥${meta.anchor || '-'}</span>
    </div>
    <div class="assumption">📈 建议引擎假设：价格弹性 1.5（销量变化% ≈ -1.5 × 价格变化%）。竞品价格来自内置监测器（仿真），真实数据源可通过 <code>recordObservation</code> 接入。</div>`;
  drawMarketChart(title, seriesList);
}

function drawMarketChart(title, seriesList) {
  const cv = $('mkt-canvas');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 235;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pad = { l: 46, r: 10, t: 12, b: 22 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  const n = Math.max(...seriesList.map(([, s]) => s.length), 2);
  const all = seriesList.flatMap(([, s]) => s.map(o => o.price));
  const max = Math.max(...all) * 1.08, min = Math.min(...all) * 0.92;
  const x = i => pad.l + iw * (i / (n - 1 || 1));
  const y = v => pad.t + ih * (1 - (v - min) / (max - min || 1));

  ctx.font = '10.5px "Segoe UI"'; ctx.fillStyle = '#646d84'; ctx.strokeStyle = 'rgba(255,255,255,.055)';
  for (let g = 0; g <= 4; g++) {
    const gy = pad.t + ih * g / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W - pad.r, gy); ctx.stroke();
    ctx.fillText(Math.round(max - (max - min) * g / 4), 6, gy + 3.5);
  }

  seriesList.forEach(([comp, series], si) => {
    ctx.beginPath();
    series.forEach((o, i) => i ? ctx.lineTo(x(i), y(o.price)) : ctx.moveTo(x(i), y(o.price)));
    ctx.strokeStyle = COMP_COLORS[si % COMP_COLORS.length]; ctx.lineWidth = 1.6; ctx.stroke();
  });
  const meta = market.rows.find(r => r.title === title);
  if (meta) {
    const ourPrice = meta.our_price;
    ctx.beginPath(); ctx.setLineDash([5, 4]);
    ctx.moveTo(pad.l, y(ourPrice)); ctx.lineTo(W - pad.r, y(ourPrice));
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.8; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('本店 ¥' + ourPrice, W - pad.r - 66, y(ourPrice) - 5);
  }
}

    </div>
    <div class="trace">${steps || '<div class="empty" style="padding:12px">思考中…</div>'}</div>
    ${job.answer != null ? `<div class="answer"><span class="who">🤖 Copilot${job.proposals ? ` · 产生 ${job.proposals} 条待审批提案<span class="goto-queue" onclick="switchView('queue')">去审批 →</span>` : ''}</span>${esc(job.answer)}</div>` : ''}
    ${job.status === 'error' ? `<div class="answer" style="border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.06)"><span class="who" style="color:var(--red)">⚠️ 失败</span>${esc(job.error || '')}</div>` : ''}
    ${job.usage ? `<div class="job-meta">${job.steps.length} 次工具调用 · ${job.usage.prompt_tokens + job.usage.completion_tokens} tokens</div>` : ''}`;
}

async function pollJob(id) {
  const { ok, data } = await api('/agent/run/' + id);
  if (!ok) return;
  renderJob(data);
  if (data.status === 'running') { jobTimer = setTimeout(() => pollJob(id), 1200); }
  else {
    currentJob = null;
    toast(data.status === 'done' ? `任务完成：${id}` : `任务失败：${data.error?.slice(0, 60)}`, data.status === 'done' ? 'ok' : 'bad');
    refresh(true);
  }
}

async function runPreset(taskId, btn) {
  if (currentJob) { toast('有任务在跑，稍等', 'bad'); return; }
  if (btn) btn.disabled = true;
  switchView('agent');
  const id = await startJob({ task_id: taskId });
  if (btn) setTimeout(() => btn.disabled = false, 1500);
  if (!id) return;
  currentJob = id;
  $('job-area').innerHTML = '<div class="empty">启动中…</div>';
  pollJob(id);
}

async function runFreeTask() {
  if (currentJob) { toast('有任务在跑，稍等', 'bad'); return; }
  const task = $('task-input').value.trim();
  if (!task) return;
  const id = await startJob({ task });
  if (!id) return;
  currentJob = id;
  $('task-input').value = '';
  $('job-area').innerHTML = '<div class="empty">启动中…</div>';
  pollJob(id);
}
$('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') runFreeTask(); });

// ---------- 审计 ----------
function renderAudit(list) {
  $('audit').innerHTML = list.map(x => `
    <div>${x.ts.slice(5, 19)} [<span class="who">${esc(x.actor)}</span>] <span class="ev">${esc(x.event)}</span> ${esc(x.detail.change_id || x.detail.path || x.detail.note || JSON.stringify(x.detail).slice(0, 70))}</div>`).join('');
}

document.querySelectorAll('#queue-filters .chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('#queue-filters .chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  state.queueFilter = c.dataset.f;
  renderQueue();
}));
['prod-search', 'prod-cat', 'prod-status'].forEach(id => {
  $(id).addEventListener('input', renderProducts);
  $(id).addEventListener('change', renderProducts);
});

// ---------- 重置 ----------
async function resetAll() {
  if (!confirm('重置会清空所有审批记录并恢复初始演示数据，确定？')) return;
  const { ok, data } = await api('/admin/reset', { method: 'POST' });
  toast(ok ? `已重置：${data.products} 商品 / ${data.orders} 订单` : '重置失败', ok ? 'ok' : 'bad');
  refresh(true);
}

// ---------- 轮询 ----------
let refreshing = false;
async function refresh(force) {
  if (refreshing) return;
  refreshing = true;
  try {
    const tasks = [api('/admin/analytics/summary?days=30'), api('/admin/revenue-trend?days=30'), api('/admin/staged-changes'), api('/admin/products'), api('/admin/insights'), api('/admin/market/report')];
    if ($('view-audit').classList.contains('on')) tasks.push(api('/admin/audit'));
    const [ana, tr, st, pr, ins, mkt, au] = await Promise.all(tasks);
    if (!ana.ok) throw new Error('server 不可达');
    $('foot').classList.remove('down'); $('live-text').textContent = sseOk ? '实时推送' : '已连接';

    const newTrend = tr.data.trend || [];
    const changed = !trend.length || JSON.stringify(newTrend) !== JSON.stringify(trend);
    trend = newTrend;
    state.analytics = ana.data;
    const stagedChanged = JSON.stringify(st.data.staged_changes) !== JSON.stringify(state.staged);
    state.staged = st.data.staged_changes;
    const prodChanged = JSON.stringify(pr.data.products) !== JSON.stringify(state.products);
    state.products = pr.data.products;

    renderKpis(ana.data);
    if (changed || force) drawChart(stagedChanged || force);
    renderQuality(ana.data.data_quality);
    if (stagedChanged || force) renderQueue();
    if (prodChanged || force) { fillCatFilter(); renderProducts(); }
    if (ins.ok) {
      if (ins.data.sim_on !== simOn) { simOn = ins.data.sim_on; updateSimBtn(); }
      const nowMedusa = ins.data.backend === 'medusa';
      if (nowMedusa !== medusaMode) { medusaMode = nowMedusa; updateSimBtn(); const line = $('backend-line'); if (line) line.textContent = medusaMode ? '数据源 · 真店 Medusa' : '数据源 · 本地仿真'; }
      const newList = ins.data.insights || [];
      const insChanged = JSON.stringify(newList) !== JSON.stringify(insights);
      if (insChanged || force) {
        insights = newList;
        for (const c of insights) insTasks[c.id] = c.task;
        renderInsights();
      }
    }
    if (mkt.ok) {
      const mktChanged = JSON.stringify(mkt.data) !== JSON.stringify(market);
      if (mktChanged || force) {
        market = mkt.data;
        if ($('view-market').classList.contains('on')) { renderMarket(); if (mktSel) selectProduct(mktSel); }
      }
    }
    if (au && au.ok) renderAudit(au.data.audit);
  } catch (e) {
    $('foot').classList.add('down'); $('live-text').textContent = '连接断开，重试中…';
  }
  refreshing = false;
}

function fillCatFilter() {
  const sel = $('prod-cat');
  const cats = [...new Set(state.products.map(p => p.category))];
  const cur = sel.value;
  if (sel.options.length === cats.length + 1 && [...sel.options].every((o, i) => i === 0 || o.value === cats[i - 1])) return;
  sel.innerHTML = '<option value="">全部类目</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = cur;
}

let visible = true;
document.addEventListener('visibilitychange', () => {
  visible = !document.hidden;
  if (visible) refresh(true);
});

// SSE 实时推送：服务端状态变化立刻通知，轮询只做降级兜底
let sseOk = false;
function connectSSE() {
  try {
    const es = new EventSource('/events');
    es.addEventListener('refresh', () => { if (visible) refresh(false); });
    es.onopen = () => { if (!sseOk) { sseOk = true; $('live-text').textContent = '实时推送'; } };
    es.onerror = () => { sseOk = false; $('live-text').textContent = '已连接（轮询）'; };
  } catch { sseOk = false; }
}
connectSSE();

// 键盘快捷键：1-6 切换视图（Linear 风格）
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey) return;
  const map = { '1': 'overview', '2': 'queue', '3': 'products', '4': 'market', '5': 'agent', '6': 'audit' };
  if (map[e.key]) switchView(map[e.key]);
});

(async function init() {
  await loadSimState();
  await refresh(true);
  const sp = document.getElementById('splash');
  if (sp) {
    setTimeout(() => sp.classList.add('hide'), 250);
    setTimeout(() => sp.style.display = 'none', 900);
  }
  setInterval(() => { if (visible && !sseOk) refresh(false); }, 4000);
  const [st, ps] = await Promise.all([api('/agent/status'), api('/agent/presets')]);
  if (st.ok) updateLlmState(st.data);
  if (ps.ok) { presets = ps.data.presets; renderPresets(); }
  renderInsights();
  const hash = location.hash.slice(1);
  if (hash && VIEW_META[hash]) switchView(hash);
})();
</script>
